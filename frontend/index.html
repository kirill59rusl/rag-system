<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>RAG</h1>
        <span id="status" class="status">проверка…</span>
      </header>

      <section class="card">
        <h2>Загрузить документ</h2>
        <form id="upload-form">
          <input type="file" name="file" required />
          <button type="submit">Загрузить</button>
        </form>
        <pre id="upload-result" class="hidden"></pre>
      </section>

      <section class="card">
        <h2>Вопрос</h2>
        <form id="ask-form">
          <textarea name="query" rows="3" placeholder="Что хотите узнать?" required></textarea>
          <div class="row">
            <label>limit <input type="number" name="limit" value="5" min="1" /></label>
            <label>reranker_limit <input type="number" name="reranker_limit" value="5" min="1" /></label>
            <label class="check"><input type="checkbox" name="retrieval_only" /> только поиск</label>
            <button type="submit">Спросить</button>
          </div>
        </form>
        <div id="answer"></div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
