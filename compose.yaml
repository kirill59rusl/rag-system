x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/rag

  EMBEDDER_PROVIDER: ${EMBEDDER_PROVIDER:-gigachat}
  EMBEDDER: ${EMBEDDER:-Embeddings}
  EMBEDDING_SPACE: ${EMBEDDING_SPACE:-1024}
  EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-128}

  LLM_PROVIDER: ${LLM_PROVIDER:-gigachat}
  LLM: ${LLM:-GigaChat-2}

  JUDGE: ${JUDGE:-}

  GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}

  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  RERANKER_PROVIDER: ${RERANKER_PROVIDER:-}
  RERANKER: ${RERANKER:-}

  RETRIEVAL_MODE: ${RETRIEVAL_MODE:-vector}
  RRF_K: ${RRF_K:-60}
  VECTOR_WEIGHT: ${VECTOR_WEIGHT:-1.0}
  BM25_WEIGHT: ${BM25_WEIGHT:-1.0}

  UPLOAD_DIR: /app/data/uploads


services:
  postgres:
    image: paradedb/paradedb:0.26.0-pg16
    container_name: rag-postgres
    # в уже инициализированном томе ParadeDB сам не пропишет preload;
    # join custom scan выключен: chunks джойнятся с documents без BM25-индекса,
    # и ParadeDB пишет WARNING на каждый запрос
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_search
      - -c
      - paradedb.enable_join_custom_scan=off
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    container_name: rag-migrate
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    container_name: rag-backend
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/data/uploads
    dns: [77.88.8.8, 188.93.16.19, 1.1.1.1, 8.8.8.8]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    profiles: ["docker-ollama"]
    image: ollama/ollama:latest
    container_name: rag-ollama
    dns: [1.1.1.1, 8.8.8.8]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


volumes:
  postgres_data:
  ollama_data:
  uploads_data: